apiVersion: apps/v1
kind: Deployment
metadata:
  name: jlpt-bun-dojo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: jlpt-bun-dojo}
  template:
    metadata:
      labels: {app: jlpt-bun-dojo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: trainer
          image: ghcr.io/alexxanddr/jlpt-bun-dojo:latest-mcp
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: jlpt-bun-dojo}
            - secretRef: {name: jlpt-bun-dojo}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: jlpt-bun-dojo}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
