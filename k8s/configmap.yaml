apiVersion: v1
kind: ConfigMap
metadata:
  name: jlpt-bun-dojo
data:
  APP_ORIGIN: http://localhost:8000
  COOKIE_SECURE: 'false'
  DATABASE_PATH: /data/trainer.sqlite3
  OPENAI_BASE_URL: http://lm-studio:1234/v1
  GENERATION_PROVIDER: openai
  EVALUATION_PROVIDER: openai
  GENERATION_MODEL: local-model
  EVALUATION_MODEL: local-model
  BUNPRO_MCP_COMMAND: /usr/local/bin/bunpro-mcp-server
  BUNPRO_MCP_ARGS: '[]'
  WANIKANI_MCP_COMMAND: /usr/local/bin/kani-mcp-server
  WANIKANI_MCP_ARGS: '[]'
